databases:
  - name: online-shop-db
    plan: free
    databaseName: online_shop
    user: online_shop_user

services:
  - type: web
    plan: free
    name: online-shop
    runtime: python

    buildCommand: ./build.sh

    startCommand: python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: online-shop-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: WEB_CONCURRENCY
        value: 4
